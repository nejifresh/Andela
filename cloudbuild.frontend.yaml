substitutions:
  _API_URL: http://localhost:8000

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - frontend/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_BASE_URL=${_API_URL}
      - -t
      - gcr.io/$PROJECT_ID/cloudwaste-dashboard
      - .
images:
  - gcr.io/$PROJECT_ID/cloudwaste-dashboard
